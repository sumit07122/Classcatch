{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-7 col-lg-6 text-center">
        <div class="card card-modern p-5 bg-white shadow-sm">
            <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle mb-3 mx-auto" style="width: 70px; height: 70px;">
                <i class="fa-solid fa-triangle-exclamation fs-2"></i>
            </div>
            <h2 class="fw-extrabold mb-2 text-dark">{{ error_code|default('Error') }} — {{ error_title|default('An unexpected error occurred') }}</h2>
            <p class="text-muted small mb-4">
                {{ error_message|default('Something went wrong. The academic technical team has been notified.') }}
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('index') }}" class="btn btn-primary-gradient px-4 py-2">
                    <i class="bi bi-house-door me-1"></i> Return to Campus Home
                </a>
                <a href="{{ url_for('timetable_view') }}" class="btn btn-light border px-4 py-2">
                    <i class="bi bi-calendar-week me-1"></i> View Timetable
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
