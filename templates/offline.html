{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-modern p-5 bg-white shadow-sm border-0">
                <i class="bi bi-wifi-off fs-1 text-warning mb-3"></i>
                <h3 class="fw-bold text-dark">You're Currently Offline</h3>
                <p class="text-muted small mb-4">
                    Campus Wi-Fi or cellular signal seems weak in this lecture hall! Don't worry, your previously opened lecture notes and attendance cards are cached in your ClassCatch PWA.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <button onclick="window.location.reload()" class="btn btn-primary-gradient px-4">
                        <i class="bi bi-arrow-clockwise me-1"></i> Try Reconnecting
                    </button>
                    <a href="{{ url_for('attendance_calculator') }}" class="btn btn-outline-secondary px-4">
                        Saved Attendance
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
